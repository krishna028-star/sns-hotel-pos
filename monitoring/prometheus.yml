global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "sns-pos-app"
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ["localhost:3000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]
